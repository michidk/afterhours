[package]
name = "afterhours-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
afterhours-physics = { path = "../physics" }
afterhours-protocol = { path = "../protocol" }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.30"
