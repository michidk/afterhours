[package]
name = "afterhours-physics"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# enhanced-determinism: identical results on native x86_64 and wasm32.
rapier3d = { version = "0.36", features = ["enhanced-determinism"] }
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2.129", optional = true }

[features]
wasm = ["dep:wasm-bindgen"]
