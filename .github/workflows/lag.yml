name: Live movement acceptance

on:
  workflow_dispatch:
    inputs:
      route:
        description: Test a fresh local server or a route to production
        type: choice
        options: [local, direct, public, work2-ingress]
        default: direct
      seconds:
        description: Measured seconds for each five-client phase
        type: string
        default: "60"

permissions:
  contents: read

concurrency:
  group: live-movement-acceptance
  cancel-in-progress: false

jobs:
  movement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Start the checked-out server
        if: inputs.route == 'local'
        run: |
          bun run build
          ALLOW_DEBUG=1 PORT=3000 bun run start > /tmp/afterhours-server.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 240); do
            if curl --fail --silent http://localhost:3000/health > /dev/null; then exit 0; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/afterhours-server.log; exit 1; fi
            sleep 1
          done
          cat /tmp/afterhours-server.log
          exit 1
      - name: Resolve the requested ingress
        if: inputs.route == 'direct' || inputs.route == 'work2-ingress'
        env:
          ROUTE: ${{ inputs.route }}
        run: |
          ingress_ip=130.61.217.172
          if [ "$ROUTE" = work2-ingress ]; then ingress_ip=178.162.254.45; fi
          echo "$ingress_ip afterhours.k8s.lohr.dev" | sudo tee -a /etc/hosts
      - name: Exercise five people, five cars, then five planes
        env:
          SECONDS_PER_PHASE: ${{ inputs.seconds }}
          ROUTE: ${{ inputs.route }}
        run: |
          mkdir -p test-results
          target_url=https://afterhours.k8s.lohr.dev
          if [ "$ROUTE" = local ]; then target_url=http://localhost:3000; fi
          node --input-type=module - "$target_url" > test-results/server-health.jsonl <<'JS' &
          import { setTimeout } from 'node:timers/promises';
          const target = new URL('/health', process.argv[2]);
          while (true) {
            const at = Date.now();
            try {
              const response = await fetch(target, { signal: AbortSignal.timeout(5000) });
              const health = await response.json();
              console.log(JSON.stringify({ at, requestMs: Date.now() - at, status: response.status, health }));
            } catch (error) {
              console.log(JSON.stringify({ at, requestMs: Date.now() - at, error: String(error) }));
            }
            await setTimeout(1000);
          }
          JS
          health_pid=$!
          trap 'kill "$health_pid" 2>/dev/null || true' EXIT
          node --import tsx scripts/five-client-test.ts \
            --url "$target_url" \
            --seconds "$SECONDS_PER_PHASE" --output test-results/five-client.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-movement-${{ inputs.route }}
          path: |
            test-results/
            /tmp/afterhours-five-*/*.jsonl
            /tmp/afterhours-five-*/*.jsonl.log
            /tmp/afterhours-server.log
