<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AFTERHOURS handling lab</title>
    <style>
      html,
      body,
      canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #15232e;
        touch-action: none;
      }
      #panel {
        position: fixed;
        top: 8px;
        left: 8px;
        max-width: 360px;
        padding: 10px 12px;
        color: #fff9eb;
        background: #15232ecc;
        font:
          12px/1.45 ui-monospace,
          monospace;
      }
      #panel select,
      #panel button {
        font: inherit;
      }
      #panel p {
        margin: 6px 0 0;
      }
      #live {
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel">
      <select id="scenario"></select>
      <select id="model">
        <option>sedan</option>
        <option>sport</option>
        <option>van</option>
      </select>
      <button id="replay">replay</button>
      <p id="about"></p>
      <p id="live"></p>
      <p id="metrics"></p>
    </div>
    <script type="module" src="/client/lab.ts"></script>
  </body>
</html>
