services:
  game:
    build: .
    restart: unless-stopped
    environment:
      PORT: 5173
      ALLOW_DEBUG: 0
      CITY_PATH: /app/data/city.json
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:5173/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      game:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
